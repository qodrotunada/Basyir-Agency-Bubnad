<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-label="Area layanan perjalanan haji dan umrah dengan Ka'bah, jamaah, perlengkapan ihram, dan peta manasik">
<defs>
