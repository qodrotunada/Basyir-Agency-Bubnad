 <path d="M260 320q32-18 64 0l13 88h-90Z"/><path d="M690 300q32-18 64 0l13 88h-90Z"/><path d="M330 430q32-18 64 0l13 88h-90Z"/><path d="M600 440q32-18 64 0l13 88h-90Z"/><path d="M140 420q32-18 64 0l13 88h-90Z"/><path d="M820 410q32-18 64 0l13 88h-90Z"/>
</g>
