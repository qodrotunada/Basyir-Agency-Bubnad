<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-label="Pasar tradisional yang ramai dengan pedagang, sayuran, buah, timbangan, dan pembeli">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f2d8aa"/><stop offset="1" stop-color="#bd8150"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c78c56"/><stop offset="1" stop-color="#68452f"/></linearGradient>
 <linearGradient id="awning" x2="0" y2="1"><stop stop-color="#9c3f2f"/><stop offset="1" stop-color="#542b27"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#9b633b"/><stop offset="1" stop-color="#56351f"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f2e4c8"/><stop offset=".5" stop-color="#9c9d91"/><stop offset="1" stop-color="#555c58"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fff5cf" stop-opacity=".8"/><stop offset="1" stop-color="#f7c47b" stop-opacity="0"/></radialGradient>
 <pattern id="tiles" width="72" height="44" patternUnits="userSpaceOnUse"><path d="M0 0H72M0 0V44" stroke="#f2c68c" stroke-opacity=".18" stroke-width="2"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
