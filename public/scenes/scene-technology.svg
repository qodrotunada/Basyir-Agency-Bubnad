<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-label="Laboratorium komputer dengan siswa, monitor, keyboard, router, dan perangkat digital">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#dce6f0"/><stop offset="1" stop-color="#9fb8ca"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#9eabb4"/><stop offset="1" stop-color="#34495b"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#143b5b"/><stop offset="1" stop-color="#071a2c"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#b67a4d"/><stop offset="1" stop-color="#65432e"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1024" height="576" fill="url(#wall)"/>
<path d="M0 0H1024V62H0Z" fill="#263f57"/>
<path d="M0 62H1024V78H0Z" fill="#e4edf0"/>
